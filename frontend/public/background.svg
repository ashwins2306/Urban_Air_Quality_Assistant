<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Atmospheric Airflow Gradients -->
    <linearGradient id="stream-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="stream-emerald" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="stream-sapphire" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="glow-soft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <radialGradient id="aurora-radial-1" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#030611" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="aurora-radial-2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#030611" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Atmospheric Blooms -->
  <rect width="1920" height="1080" fill="url(#aurora-radial-1)" />
  <rect width="1920" height="1080" fill="url(#aurora-radial-2)" />

  <!-- Minimal Clean Air Streamlines / Isobars -->
  <g fill="none" stroke-linecap="round">
    <!-- Primary Upper Atmospheric Flow -->
    <path d="M-100,180 C320,120 640,320 1100,210 C1560,100 1820,260 2050,220" 
          stroke="url(#stream-cyan)" stroke-width="2" />
    <path d="M-80,220 C340,160 660,360 1120,250 C1580,140 1840,300 2070,260" 
          stroke="url(#stream-cyan)" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="6 8" />

    <!-- Secondary Harmonic Breeze -->
    <path d="M-120,380 C280,290 720,480 1240,370 C1620,290 1890,420 2080,390" 
          stroke="url(#stream-sapphire)" stroke-width="1.8" />
    <path d="M-100,410 C300,320 740,510 1260,400 C1640,320 1910,450 2100,420" 
          stroke="url(#stream-sapphire)" stroke-width="1" stroke-opacity="0.5" />

    <!-- Central Clean Air Isobar Contours -->
    <path d="M-60,590 C360,520 840,680 1380,560 C1750,480 1920,620 2060,600" 
          stroke="url(#stream-emerald)" stroke-width="1.8" />
    <path d="M-40,620 C380,550 860,710 1400,590 C1770,510 1940,650 2080,630" 
          stroke="url(#stream-emerald)" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4 6" />

    <!-- Lower Tropospheric Drift -->
    <path d="M-100,820 C420,740 780,920 1310,810 C1690,730 1880,880 2050,850" 
          stroke="url(#stream-cyan)" stroke-width="1.5" />
    <path d="M-80,850 C440,770 800,950 1330,840 C1710,760 1900,910 2070,880" 
          stroke="url(#stream-cyan)" stroke-width="1" stroke-opacity="0.4" />

    <!-- Delicate Deep Wave -->
    <path d="M-120,980 C260,910 820,1030 1450,940 C1780,890 1940,990 2080,970" 
          stroke="url(#glow-soft)" stroke-width="1.2" stroke-opacity="0.7" />
  </g>

  <!-- Atmospheric Micro-Nodes / Clean Air Molecules -->
  <g fill="#38bdf8" opacity="0.35">
    <circle cx="340" cy="160" r="2.5" />
    <circle cx="660" cy="360" r="2" />
    <circle cx="1120" cy="250" r="3" />
    <circle cx="1580" cy="140" r="2" />
    <circle cx="1840" cy="300" r="2.5" />

    <circle cx="280" cy="290" r="2" />
    <circle cx="720" cy="480" r="3" fill="#818cf8" />
    <circle cx="1240" cy="370" r="2.5" />
    <circle cx="1620" cy="290" r="2" />

    <circle cx="380" cy="550" r="2.5" fill="#34d399" />
    <circle cx="860" cy="710" r="3" fill="#34d399" />
    <circle cx="1400" cy="590" r="2" fill="#34d399" />

    <circle cx="440" cy="770" r="2" />
    <circle cx="1310" cy="810" r="3" />
    <circle cx="1690" cy="730" r="2" />
  </g>

  <!-- Soft Ambient Glow Centers on Nodes -->
  <g fill="#38bdf8" opacity="0.12">
    <circle cx="1120" cy="250" r="16" />
    <circle cx="720" cy="480" r="14" fill="#818cf8" />
    <circle cx="860" cy="710" r="14" fill="#34d399" />
    <circle cx="1310" cy="810" r="16" />
  </g>
</svg>
