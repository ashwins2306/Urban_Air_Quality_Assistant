<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cfc-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#051a14" />
      <stop offset="60%" stop-color="#062e24" />
      <stop offset="100%" stop-color="#02140f" />
    </linearGradient>
    <radialGradient id="cfc-sun" cx="50%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#34d399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#051a14" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cfc-foliage-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cfc-foliage-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="600" height="340" rx="16" fill="url(#cfc-bg)" />
  <circle cx="300" cy="110" r="160" fill="url(#cfc-sun)" />

  <!-- Botanical Canopy Dome Clouds of Greenery -->
  <g id="canopy-trees">
    <!-- Back Deep Trees -->
    <circle cx="160" cy="180" r="85" fill="#064e3b" opacity="0.8" />
    <circle cx="300" cy="160" r="95" fill="#047857" opacity="0.85" />
    <circle cx="440" cy="180" r="85" fill="#064e3b" opacity="0.8" />

    <!-- Foreground Lush Tree Crowns -->
    <path d="M70,260 Q60,180 140,160 Q210,130 250,190 Q220,270 70,260 Z" fill="url(#cfc-foliage-1)" />
    <path d="M220,260 Q200,150 300,120 Q400,140 390,260 Z" fill="url(#cfc-foliage-2)" />
    <path d="M360,260 Q380,140 470,165 Q540,190 530,260 Z" fill="url(#cfc-foliage-1)" />

    <!-- Tree Trunks & Forest Floor -->
    <path d="M150,230 L145,300 M295,210 L295,300 M450,225 L455,300" stroke="#78350f" stroke-width="8" stroke-linecap="round" />
    <!-- Rolling Grass Hill -->
    <path d="M-20,285 Q150,260 300,270 T620,275 L620,350 L-20,350 Z" fill="#022c22" />
    <path d="M-20,300 Q180,275 360,290 T620,290 L620,350 L-20,350 Z" fill="#044e3b" />
  </g>

  <!-- Clean Air Oxygen Waves & Forest Motes -->
  <g fill="none" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round" opacity="0.6">
    <path d="M50,120 Q180,80 320,110 T550,90" />
    <path d="M80,150 Q220,110 360,135 T570,120" stroke-dasharray="6 8" />
  </g>

  <g fill="#a7f3d0" opacity="0.8">
    <circle cx="210" cy="90" r="3" />
    <circle cx="340" cy="75" r="2.5" />
    <circle cx="430" cy="110" r="3" />
    <circle cx="160" cy="140" r="2" />
    <circle cx="490" cy="130" r="2.5" />
  </g>
</svg>
